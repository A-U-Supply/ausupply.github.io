name: Song Titles Bot

on:
  schedule:
    - cron: '0 5 * * *'  # 5am UTC daily (before midi-bot and glottisdale)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-song-titles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r song-titles-bot/requirements.txt

      - name: Run song titles bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python song-titles-bot/bot.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add song-titles-bot/titles.json this-song-is-a-junkyard.html
          if git diff --staged --quiet; then
            echo "No song-title changes to commit."
          else
            git commit -m "chore: update song titles ($(date +%Y-%m-%d)) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin master && git push && break
              echo "Push attempt $i failed; retrying..."
              sleep 2
            done
          fi

name: Glottisdale

on:
  schedule:
    - cron: '0 18 * * *'  # 10am PT daily
  workflow_dispatch:
    inputs:
      target_duration:
        description: 'Target duration in seconds'
        default: '30'
      max_videos:
        description: 'Max source videos'
        default: '5'
      whisper_model:
        description: 'Whisper model (tiny/base/small)'
        default: 'base'
      seed:
        description: 'RNG seed (empty for random)'
        default: ''

jobs:
  glottisdale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-models-${{ inputs.whisper_model || 'base' }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install openai-whisper
          pip install -r glottisdale-bot/requirements.txt

      - name: Download glottisdale binary
        run: |
          gh release download --repo A-U-Supply/glottisdale --pattern 'glottisdale-linux-amd64' --dir /tmp
          chmod +x /tmp/glottisdale-linux-amd64
          sudo mv /tmp/glottisdale-linux-amd64 /usr/local/bin/glottisdale
          glottisdale --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run glottisdale
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          ARGS="--target-duration ${{ inputs.target_duration || '30' }}"
          ARGS="$ARGS --max-videos ${{ inputs.max_videos || '5' }}"
          ARGS="$ARGS --whisper-model ${{ inputs.whisper_model || 'base' }}"
          ARGS="$ARGS --aligner auto"
          if [ -n "${{ inputs.seed }}" ]; then
            ARGS="$ARGS --seed ${{ inputs.seed }}"
          fi
          python glottisdale-bot/bot.py $ARGS

      - name: Commit usage tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add glottisdale-bot/used-song-titles.json
          git diff --staged --quiet || git commit -m "chore: update glottisdale song title usage [skip ci]"
          git push
